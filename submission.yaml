submission:
  title: "PRAANJEEV — AI Emergency Response & Hospital Coordination System"

  problem_statement: >
    During medical emergencies, patients, families and ambulance teams may struggle
    to identify the right hospital based on emergency requirements, available
    resources, treatment capabilities, traffic and travel time. Hospitals may also
    receive insufficient information or preparation time before an emergency patient
    arrives. PRAANJEEV addresses this coordination problem using AI-powered decision
    support.

  solution_summary: >
    PRAANJEEV is an AI-powered emergency response and hospital coordination platform
    that connects patients, ambulances and verified hospitals. It assesses emergency
    information, identifies required medical capabilities, ranks suitable hospitals
    using resources, verification, distance and ETA, provides emergency routing,
    and securely shares minimum necessary information with the selected hospital
    so it can prepare before the patient arrives.

  key_features:
    - "AI Emergency Assessment and decision support"
    - "AI-powered hospital matching based on condition, capabilities, resources and ETA"
    - "Verified hospital and real-time resource intelligence"
    - "Smart traffic-aware emergency routing"
    - "Hospital pre-alert and Emergency Case ID coordination"

  tech_stack:
    languages:
      - "Python"
      - "JavaScript"
      - "HTML"
      - "CSS"

    frameworks:
      - "Flask"

    ibm_technologies:
      - "IBM BoB"

    databases:
      - "MySQL"

    other:
      - "REST API"
      - "Maps / Routing API"
      - "GitHub"
      - "GitHub Actions"

  what_we_are_most_proud_of: >
    PRAANJEEV goes beyond simply finding the nearest hospital. Its core innovation
    is condition-aware and resource-aware hospital matching that considers required
    medical capabilities, verified hospital status, available resources, distance
    and travel time. The system also shares a consent-based emergency pre-alert
    with the selected hospital, giving the hospital an opportunity to prepare
    before the patient arrives.

  known_limitations: >
    The hackathon prototype may use simulated hospital and resource data where
    real-time verified healthcare data is unavailable. Hospital resource status
    cannot be guaranteed until confirmed by the hospital. AI outputs are decision
    support and are not medical diagnoses. Production deployment would require
    secure healthcare integrations, stronger privacy controls, real-time resource
    synchronization, extensive validation and clinical/regulatory review.

